<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Séries</title>
    <link rel="stylesheet" href="CSS/estilo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="body">

    
        <h1 class="text-center mt-4">Procure seus filmes e séries favoritos!</h1>


    <section class="container mt-4">

        <form id="formBusca">
            <div class="input-group mb-3">
                <input type="text" id="busca" class="form-control" placeholder="Digite o que deseja buscar..." aria-label="Busca de séries">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </form>

        <p id="mensagem"></p>

        <div id="container" class="d-flex flex-wrap gap-3"></div>

    </section>

    <script src="JavaScript/javascript.js"></script>

</body>
</html>
