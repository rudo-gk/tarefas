<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    
    
    <h1>lista de tarefas</h1>
        
    

    <input type="text" id="nome">


    <select id="estado">
        <option class="concluido">Concluido</option>
        <option class="pendente">Pendente</option>
        <option class="em-andamento">Em andamento</option>
    </select>

    
    <button onclick="OK()">ok</button>

    <br><br>

    <div id="container" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>

    
    
    <script>
        function OK(){
            let valor = document.getElementById("nome").value;
            let estado = document.getElementById("estado").value;
            let div = document.createElement("div");
            document.getElementById("container").appendChild(div);
            div.innerHTML = "Nome: " + valor + " | Estado: " + estado;
            div.style.backgroundColor = estado === "Concluido" ? "green" : estado === "Pendente" ? "red" : "orange";
            div.style.width = "200px";
            div.style.height = "50px";
            div.style.color = "white";
            div.style.borderRadius = "5px";
            div.style.display = "flex";
            div.style.flexDirection = "row";
            div.style.justifyContent = "center";
        }

    </script>



</body>
</html>
